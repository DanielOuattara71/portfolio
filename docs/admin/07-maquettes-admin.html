<style>
/* Layout: CMS shell. Fixed sidebar (grouped modules) + top bar + one working area per screen; drawer under 900px.
   Tokens follow the portfolio design system (paper / ink / orange marker, Poppins only), toned down for daily work. */
:root {
  --paper: #f3f0e8; --surface: #faf8f3; --sunken: #ebe6da; --ink: #141311; --muted: #6b665c; --line: #e0dacd;
  --marker: #ff7a1a; --on-marker: #141311; --on-ink: #f3f0e8;
  --ok: #2c7a4b; --ok-bg: #e2efe6; --warn: #8a5a00; --warn-bg: #f6ead2; --crit: #b3261e; --crit-bg: #f6dedb; --info: #2f5d8a; --info-bg: #dfe8f1;
  --font: Poppins, "Segoe UI", system-ui, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-full: 999px;
  --shadow: 0 1px 0 rgba(20,19,17,.04), 0 8px 24px -12px rgba(20,19,17,.18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #141311; --surface: #1c1a17; --sunken: #24211d; --ink: #ecebe6; --muted: #a39d92; --line: #34302a;
  --on-ink: #141311; --ok: #7cc49a; --ok-bg: #1d3226; --warn: #e5b45a; --warn-bg: #3a2d14; --crit: #f08a80; --crit-bg: #3d1c19; --info: #8db6df; --info-bg: #1b2a3a;
  --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #141311; --surface: #1c1a17; --sunken: #24211d; --ink: #ecebe6; --muted: #a39d92; --line: #34302a;
  --on-ink: #141311; --ok: #7cc49a; --ok-bg: #1d3226; --warn: #e5b45a; --warn-bg: #3a2d14; --crit: #f08a80; --crit-bg: #3d1c19; --info: #8db6df; --info-bg: #1b2a3a;
  --shadow: 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.55 var(--font); font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--paper); }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.lab { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* Mock banner */
.mock { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); color: var(--on-ink); font-size: 12px; }
.mock b { color: var(--marker); font-weight: 600; }
.mock .tools { display: flex; gap: 8px; }
.mock button { background: transparent; border: 1px solid color-mix(in srgb, var(--on-ink) 35%, transparent); border-radius: var(--r-full); padding: 3px 10px; cursor: pointer; color: var(--on-ink); }

/* Shell */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100% - 36px); }
.sb { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mk { width: 30px; height: 30px; border-radius: var(--r-sm); background: var(--marker); color: var(--on-marker); display: grid; place-items: center; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--on-marker); flex: none; }
.brand small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.nav { display: grid; gap: 14px; }
.nav .grp { display: grid; gap: 2px; }
.nav .lab { padding: 0 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink); }
.nav a:hover { background: var(--sunken); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.nav a[aria-current="page"] .dot { background: var(--marker); }
.nav .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
.nav .cnt { margin-left: auto; font-size: 11px; padding: 0 7px; border-radius: var(--r-full); background: var(--marker); color: var(--on-marker); font-weight: 600; }
.sb .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-md); background: var(--sunken); font-size: 12px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.crumb { font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--ink); font-weight: 500; }
.top .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--surface); color: var(--muted); font-size: 12px; min-width: 0; }
.search kbd { font: inherit; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; }
.btn.menu-btn { display: none; }
#view { padding-block: 24px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; align-content: start; max-width: 1280px; width: 100%; }

/* Building blocks */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head .t { display: grid; gap: 4px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel > .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r-full); border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); font-weight: 500; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.sec { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.sec:hover { border-color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: var(--r-full); font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--sunken); color: var(--muted); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.crit { background: var(--crit-bg); color: var(--crit); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.plain::before { display: none; }
.tag { display: inline-flex; padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--r-full); font-size: 12px; background: var(--surface); }
.ex { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--info); background: var(--info-bg); padding: 1px 6px; border-radius: 5px; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.id { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--marker); color: var(--on-marker); font-weight: 600; }
.lang { display: inline-flex; gap: 4px; }
.lang span { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--ok-bg); color: var(--ok); }
.lang span.no { background: var(--crit-bg); color: var(--crit); }
.lang span.part { background: var(--warn-bg); color: var(--warn); }
.handle { color: var(--muted); cursor: grab; letter-spacing: -2px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 12px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--marker); font-weight: 500; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: var(--r-full); cursor: pointer; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .fl { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.req { color: var(--crit); }
.inp, textarea.inp, select.inp { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); min-width: 0; }
textarea.inp { resize: vertical; min-height: 76px; }
.inp:focus { outline: 2px solid var(--marker); outline-offset: -1px; border-color: transparent; }
.inp.err { border-color: var(--crit); }
.hint { font-size: 11.5px; color: var(--muted); }
.hint.err { color: var(--crit); }
.hint.warn { color: var(--warn); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair .lh { font-size: 11px; font-weight: 600; color: var(--muted); }
.flag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--warn-bg); color: var(--warn); }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; border: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.check { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.check li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 12.5px; align-items: start; }
.check .i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.check .i.y { background: var(--ok-bg); color: var(--ok); }
.check .i.n { background: var(--crit-bg); color: var(--crit); }
.check .i.w { background: var(--warn-bg); color: var(--warn); }
.savebar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.savebar .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

/* Editor */
.editor { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); overflow: hidden; }
.tb { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tb button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.tb button:hover { background: var(--sunken); }
.tb .sep { width: 1px; background: var(--line); margin: 4px 4px; }
.doc { padding: 14px 16px; min-height: 120px; display: grid; gap: 10px; font-size: 14px; }
.acc { font-style: italic; background: color-mix(in srgb, var(--marker) 22%, transparent); border-radius: 4px; padding: 0 2px; }
.preview { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--paper); }
.preview .bar { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); background: var(--surface); }
.hero-pv { padding: 18px; display: grid; gap: 10px; }
.hero-pv .big { font-size: 34px; line-height: .9; font-weight: 700; letter-spacing: -.04em; text-transform: uppercase; }
.hero-pv .big .o { color: transparent; -webkit-text-stroke: 1px var(--ink); }
.hero-pv .lead { font-weight: 700; font-size: 18px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--surface); font-size: 12px; font-weight: 500; }

/* Stats, status */
.stat { display: grid; gap: 4px; }
.stat .n { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.svc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); }
.svc svg { grid-column: 1 / -1; width: 100%; height: 32px; }
.list { display: grid; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.list li:last-child { border-bottom: 0; }
.sev { width: 8px; height: 8px; border-radius: 50%; }
.sev.i { background: var(--info); } .sev.w { background: var(--warn); } .sev.c { background: var(--crit); } .sev.o { background: var(--ok); }
.todo li { grid-template-columns: auto minmax(0, 1fr) auto; }
.todo a { font-size: 12px; }

/* Media */
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.mt { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer; text-align: left; }
.mt[aria-pressed="true"] { outline: 2px solid var(--marker); }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-sm); background: repeating-linear-gradient(135deg, var(--sunken) 0 9px, var(--line) 9px 18px); display: grid; place-items: center; font-size: 11px; color: var(--muted); font-weight: 600; }
.thumb.pdf { background: var(--sunken); }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r-lg); padding: 18px; text-align: center; color: var(--muted); background: var(--surface); }

/* Inbox */
.inbox { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
.msg { display: grid; gap: 2px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.msg[aria-current="true"] { background: var(--sunken); }
.msg .from { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.msg.unread .from::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--marker); align-self: center; margin-right: 6px; }

/* SEO preview */
.serp { padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); display: grid; gap: 2px; }
.serp .u { font-size: 12px; color: var(--muted); }
.serp .ti { font-size: 17px; color: var(--info); }
.meter { height: 4px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter i.w { background: var(--warn); }

/* Login */
.login { min-height: calc(100vh - 36px); display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login .card { width: min(400px, 100%); display: grid; gap: 16px; padding: 28px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.otp { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.otp input { text-align: center; font-size: 20px; font-weight: 600; padding: 10px 0; }
.alert { display: block; padding: 10px 12px; border-radius: var(--r-md); font-size: 12.5px; }
.alert.crit { background: var(--crit-bg); color: var(--crit); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }

/* Modal + toast + skeleton */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(20,19,17,.45); }
.modal { width: min(480px, 100%); display: grid; gap: 14px; padding: 22px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; z-index: 70; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: var(--r-md); background: var(--ink); color: var(--on-ink); font-size: 13px; box-shadow: var(--shadow); }
.sk { border-radius: 6px; background: linear-gradient(90deg, var(--sunken), var(--line), var(--sunken)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .switch::after { transition: none; } }
.empty { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 28px; color: var(--muted); }

/* Responsive */
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .split { grid-template-columns: minmax(0, 1fr); } .inbox { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sb { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(290px, 86vw); height: 100%; transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .sb.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  #txt-grid { grid-template-columns: minmax(0, 1fr) !important; }
  .search .txt { display: none; }
  .g3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .g2, .g4, .pair { grid-template-columns: minmax(0, 1fr); }
  #view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hide-sm { display: none; }
  .hero-pv .big { font-size: 26px; }
}
</style>

        <h1>Double authentification</h1>
        <p class="muted small">Saisis le code à 6 chiffres de ton application d'authentification.</p>
        <div class="otp">${[1, 2, 3, 4, 5, 6].map((i) => `<input class="inp" inputmode="numeric" maxlength="1" aria-label="Chiffre ${i}">`).join('')}</div>
        <button class="btn" style="justify-content:center">Se connecter</button>
        <a class="small muted" href="#connexion">Utiliser un code de secours</a>`}
      <p class="small muted">Pas d'inscription publique : les comptes sont créés sur invitation.</p>
    </form></div>`

  /* ---------- Modals ---------- */
  const MODALS = {
    publish: ['Publication impossible', `<p>Corrige ces points avant de publier <b>Retrouve Moi</b> :</p><ul class="check"><li><span class="i n">✕</span><span>Ajouter au moins un lien</span></li><li><span class="i n">✕</span><span>Confirmer les 3 champs « à valider »</span></li><li><span class="i n">✕</span><span>Texte alternatif anglais d'une capture</span></li></ul><p class="small muted">La version en ligne n'a pas changé.</p>`, [['Fermer', 'sec']]],
    'publish-ok': ['Publier le Hero ?', `<p>La copie de travail remplace la version en ligne, en FR et en EN. Pages mises à jour : accueil FR et EN.</p><p class="small muted">L'ancienne version reste dans l'historique.</p>`, [['Annuler', 'sec'], ['Publier', '', 'Hero publié · site mis à jour']]],
    unpublish: ['Dépublier Retrouve Moi ?', `<p>Le projet disparaît du site, de l'accueil, de la page Projets, de la page Expertise et du sitemap. Son adresse renverra une erreur 404.</p>`, [['Annuler', 'sec'], ['Dépublier', 'danger', 'Retrouve Moi dépublié']]],
    archive: ['Archiver Retrouve Moi ?', `<p>Le projet est retiré du site et passe en lecture seule. Tu pourras le restaurer en brouillon.</p>`, [['Annuler', 'sec'], ['Archiver', 'danger', 'Retrouve Moi archivé']]],
    discard: ['Abandonner les modifications ?', `<p>La copie de travail redevient identique à la version publiée. Les points de sauvegarde restent dans l'historique.</p>`, [['Annuler', 'sec'], ['Abandonner', 'danger', 'Modifications abandonnées']]],
    restore: ['Restaurer cette version ?', `<p>Elle devient la nouvelle copie de travail. <b>Rien n'est publié</b> : tu la relis, puis tu publies.</p>`, [['Annuler', 'sec'], ['Restaurer', '', 'Version restaurée en copie de travail']]],
    diff: ['Comparer · copie de travail ↔ publiée', `<div class="grid" style="gap:8px"><span class="lab">Accroche · FR</span><p><del style="color:var(--crit)">Une application pour retrouver ce qu'on a perdu.</del></p><p><ins style="color:var(--ok);text-decoration:none">Une application mobile pour retrouver ce qu'on a perdu.</ins></p><span class="lab">Mon rôle · EN</span><p class="small muted">Inchangé</p></div>`, [['Fermer', 'sec']]],
    preview: ['Aperçu privé', `<p>L'aperçu ouvre la vraie page du site avec la copie de travail, dans un nouvel onglet, marqué « Aperçu ».</p><p class="small muted">Lien valable 30 min, réservé aux comptes connectés, non indexé.</p>`, [['Fermer', 'sec'], ['Ouvrir l’aperçu FR', '', 'Aperçu ouvert (maquette)']]],
    reauth: ['Confirme ton identité', `<p class="small">Modifier les paramètres demande une connexion de moins de 10 min.</p><div class="field"><label for="ra-p">Mot de passe</label><input id="ra-p" class="inp" type="password"></div><div class="field"><label for="ra-c">Code à 6 chiffres</label><input id="ra-c" class="inp" inputmode="numeric" maxlength="6"></div>`, [['Annuler', 'sec'], ['Confirmer et publier', '', 'Paramètres publiés']]],
    'delete-media': ['Supprimer ce fichier ?', `<p>Il n'est utilisé par aucun contenu. Il part dans la corbeille 30 jours, puis il est supprimé définitivement.</p>`, [['Annuler', 'sec'], ['Supprimer', 'danger', 'Fichier mis à la corbeille']]],
    'delete-msg': ['Supprimer ce message ?', `<p>Suppression définitive, sans corbeille.</p>`, [['Annuler', 'sec'], ['Supprimer', 'danger', 'Message supprimé']]],
    'revoke-all': ['Déconnecter les autres sessions ?', `<p>Toutes tes sessions sauf celle-ci sont fermées immédiatement.</p>`, [['Annuler', 'sec'], ['Déconnecter', 'danger', '1 session révoquée']]],
    'restore-backup': ['Restaurer la sauvegarde du 7 nov. ?', `<ol class="small" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Vérification : 5 projets, 12 textes, 214 versions, 31 médias</li><li>Sauvegarde de l'état actuel</li><li>Restauration en une transaction</li><li>Toutes les sessions sont fermées</li></ol><div class="field"><label for="rb">Tape <b>RESTAURER</b> pour confirmer</label><input id="rb" class="inp"></div>`, [['Annuler', 'sec'], ['Restaurer', 'danger', 'Restauration terminée (maquette)']]],
  }

  /* ---------- Render ---------- */
  const root = document.getElementById('root')
  let loading = false
  function current() { const h = location.hash.slice(1); return V[h] ? h : 'tableau' }
  function skeleton() { return `<div class="sk" style="height:28px;width:240px"></div><div class="grid g4">${'<div class="panel"><div class="sk" style="height:12px;width:50%"></div><div class="sk" style="height:28px;width:40%"></div></div>'.repeat(4)}</div><div class="panel">${'<div class="sk" style="height:14px"></div>'.repeat(6)}</div>` }
  function render() {
    const r = current()
    if (r === 'connexion') { root.innerHTML = V.connexion(); return }
    root.innerHTML = `<div class="app">
      <aside class="sb" id="sb" aria-label="Navigation de l'admin">
        <div class="brand"><span class="mk">/</span><span>Administration<small>Portfolio · FR / EN</small></span></div>
        <nav class="nav">${NAV.map(([g, items]) => `<div class="grp">${g ? `<span class="lab">${g}</span>` : ''}${items.map(([k, l, c]) => `<a href="#${k}" ${k === r || (r === 'projet' && k === 'projets') ? 'aria-current="page"' : ''}><span class="dot"></span>${l}${c ? `<span class="cnt">${c}</span>` : ''}</a>`).join('')}</div>`).join('')}</nav>
        <a class="small muted" href="#connexion" style="padding:0 10px">Écran de connexion</a>
        <div class="me"><span class="avatar">A</span><span style="min-width:0">Administrateur<br><span class="muted">2FA active</span></span></div>
      </aside>
      <div class="main">
        <header class="top"><button class="btn sec menu-btn" id="menu" aria-controls="sb" aria-expanded="false">Menu</button>
          <span class="crumb">Admin / <b>${TITLES[r]}</b></span><span class="sp"></span>
          <span class="search"><span class="txt">Rechercher</span><kbd>Ctrl K</kbd></span>
          <span class="btn sec hide-sm">Voir le site ↗</span></header>
        <main id="view">${loading ? skeleton() : V[r]()}</main>
      </div></div>`
    document.title = 'Admin Index Studio'
  }
  function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = `<span>✓</span>${msg}`; document.body.appendChild(t); setTimeout(() => t.remove(), 2600) }
  function modal(key) {
    const [title, body, acts] = MODALS[key]
    const o = document.createElement('div'); o.className = 'overlay'
    o.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t" style="font-size:17px">${title}</h2>${body}<div class="acts">${acts.map(([l, c, t]) => `<button class="btn ${c}" data-close="${t || ''}">${l}</button>`).join('')}</div></div>`
    document.body.appendChild(o)
    const first = o.querySelector('input, .acts .btn:last-child'); first?.focus()
    o.addEventListener('click', (e) => { const b = e.target.closest('[data-close]'); if (e.target === o || b) { o.remove(); if (b?.dataset.close) toast(b.dataset.close) } })
    o.addEventListener('keydown', (e) => { if (e.key === 'Escape') o.remove() })
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-modal], [data-toast], [data-tab], [data-lang], [data-sel], [data-msg], .switch, .seg button, #menu')
    if (!t) return
    if (t.id === 'menu') { const sb = document.getElementById('sb'); sb.classList.toggle('open'); t.setAttribute('aria-expanded', sb.classList.contains('open')); return }
    if (t.dataset.modal) return modal(t.dataset.modal)
    if (t.dataset.toast) return toast(t.dataset.toast)
    if (t.dataset.tab) { e.preventDefault(); projTab = t.dataset.tab; if (location.hash !== '#projet') location.hash = 'projet'; else render(); return }
    if (t.dataset.lang) { txtLang = t.dataset.lang; return render() }
    if (t.dataset.sel) { sel = +t.dataset.sel; return render() }
    if (t.dataset.msg) { msgSel = +t.dataset.msg; return render() }
    if (t.classList.contains('switch')) return t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true')
    if (t.closest('.seg')) { t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === t)) }
  })
  document.addEventListener('submit', (e) => { if (e.target.id === 'login-form') { e.preventDefault(); loginStep = loginStep === 1 ? 2 : 1; if (loginStep === 1) location.hash = 'tableau'; else render() } })
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's' && current() === 'projet') { e.preventDefault(); toast('Point de sauvegarde créé (v5)') } })
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0) })

  const themes = ['system', 'light', 'dark']; let ti = 0
  document.getElementById('theme-btn').addEventListener('click', (e) => { ti = (ti + 1) % 3; const th = themes[ti]; if (th === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th; e.target.textContent = 'Thème : ' + { system: 'système', light: 'clair', dark: 'sombre' }[th] })
  document.getElementById('load-btn').addEventListener('click', () => { loading = true; render(); setTimeout(() => { loading = false; render() }, 1600) })
  render()
})()
</script>
