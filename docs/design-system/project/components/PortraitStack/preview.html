<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div class="ix-stack">
  <div class="ix-badge-rot" aria-hidden="true"><svg viewBox="0 0 116 116"><defs><path id="c" d="M58,58 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs><text><textPath href="#c">SOFTWARE · DATA · CLOUD · IA · WEB · MOBILE ·</textPath></text></svg><div class="ix-badge-rot__core">001</div></div>
  <div class="ix-stack__cards" id="cards">
    <figure class="ix-pcard" data-pos="0"><canvas width="240" height="300" id="p1" role="img" aria-label="Emplacement du portrait"></canvas><figcaption><span>portrait.jpg</span><span class="ix-ph">à fournir</span></figcaption></figure>
    <figure class="ix-pcard" data-pos="1"><canvas width="240" height="300" id="p2" role="img" aria-label="Portrait en trame 1 bit"></canvas><figcaption><span>vue données</span><span>1 bit</span></figcaption></figure>
    <figure class="ix-pcard ix-pcard--profile" data-pos="2"><div class="ix-pcard__big">SWE<br>+ DATA</div><dl class="ix-fields"><dt>role</dt><dd>Software &amp; Data Engineer</dd><dt>langs</dt><dd>fr · en</dd><dt>mode</dt><dd>télétravail</dd></dl></figure>
  </div>
  <div class="ix-stack__ctl"><button class="ix-iconbtn" type="button" id="pv" aria-label="Carte précédente">←</button><span class="ix-stack__lbl" id="lbl">portrait</span><button class="ix-iconbtn" type="button" id="nx" aria-label="Carte suivante">→</button></div>
</div>
<script>
var B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function lum(x,y,W,H){var hx=(x-W*.5)/(W*.19),hy=(y-H*.33)/(H*.17),a=hx*hx+hy*hy,sx=(x-W*.5)/(W*.5),sy=(y-H*1.04)/(H*.46),b=sx*sx+sy*sy;if(a<1)return .18+a*.28+(x/W)*.18;if(b<1)return .1+b*.22+(x/W)*.12;return -1;}
function draw(id,dither){var c=document.getElementById(id),x=c.getContext('2d'),W=c.width,H=c.height,im=x.createImageData(W,H),s=dither?3:1;
for(var j=0;j<H;j++)for(var i=0;i<W;i++){var qx=Math.floor(i/s)*s,qy=Math.floor(j/s)*s,v=lum(qx,qy,W,H),o=(j*W+i)*4;if(v<0)v=dither?.78-(qy/H)*.25:.86-(qy/H)*.1;
if(dither){var t=(B[(qy/s)%4][(qx/s)%4]+.5)/16;if(v>t){im.data[o]=242;im.data[o+1]=220;im.data[o+2]=59;}else{im.data[o]=im.data[o+1]=im.data[o+2]=20;}}
else{im.data[o]=Math.round(v*252);im.data[o+1]=Math.round(v*246);im.data[o+2]=Math.round(v*234);}im.data[o+3]=255;}x.putImageData(im,0,0);}
draw('p1',false);draw('p2',true);
var cs=[].slice.call(document.querySelectorAll('.ix-pcard')),n=['portrait','vue données','fiche profil'],f=0;
function lay(){cs.forEach(function(c,i){c.dataset.pos=String((i-f+3)%3);c.setAttribute('aria-hidden',String(i!==f));});document.getElementById('lbl').textContent=n[f];}
document.getElementById('nx').onclick=function(){f=(f+1)%3;lay();};document.getElementById('pv').onclick=function(){f=(f+2)%3;lay();};document.getElementById('cards').onclick=function(){f=(f+1)%3;lay();};lay();
</script>
</body>
</html>
