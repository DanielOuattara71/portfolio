<title>Maquettes Index Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Martian+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: multi-page prototype of the portfolio; pages render inside a device frame (container queries) so desktop / tablet / mobile can be reviewed in one window. Tokens = Index Studio design system. */
:root{
  --surface:#f3f0e8; --surface-sunken:#ebe6da; --surface-raised:#faf8f3; --surface-inverse:#1c1a17; --placeholder:#e2dccf;
  --ink:#141311; --ink-muted:#6b665c; --ink-inverse:#ecebe6; --ink-inverse-muted:#a9a59b; --on-ink:#f3f0e8;
  --line:#e0dacd; --line-inverse:#2e2b26; --marker:#f2dc3b; --on-marker:#141311; --success:#1f8a4c;
  --focus-ring:#2340e8; --focus-ring-inverse:#8fa0ff; --stage:#dcd6c9;
  --f-disp:Poppins,"Arial Black",system-ui,sans-serif; --f-body:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Martian Mono",ui-monospace,Menlo,Consolas,monospace; --f-acc:Newsreader,Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.76,0,.24,1);
  --shadow-button:0 0 0 4px rgba(20,19,17,.07),0 12px 30px -14px rgba(0,0,0,.6);
  --shadow-lift:0 30px 60px -28px rgba(0,0,0,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#141311; --surface-sunken:#1c1a17; --surface-raised:#221f1b; --surface-inverse:#2a2622; --placeholder:#2e2a25;
  --ink:#f3f0e8; --ink-muted:#a8a194; --ink-inverse:#f3f0e8; --ink-inverse-muted:#b5afa3; --on-ink:#141311;
  --line:#34302a; --line-inverse:#3d3832; --success:#4cc27a; --focus-ring:#8fa0ff; --stage:#0c0b0a; color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#141311; --surface-sunken:#1c1a17; --surface-raised:#221f1b; --surface-inverse:#2a2622; --placeholder:#2e2a25;
  --ink:#f3f0e8; --ink-muted:#a8a194; --ink-inverse:#f3f0e8; --ink-inverse-muted:#b5afa3; --on-ink:#141311;
  --line:#34302a; --line-inverse:#3d3832; --success:#4cc27a; --focus-ring:#8fa0ff; --stage:#0c0b0a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance}p{margin:0}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px;border-radius:4px}
.inv :focus-visible{outline-color:var(--focus-ring-inverse)}
.on-marker :focus-visible{outline-color:var(--on-marker)}
.acc{font-family:var(--f-acc);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--f-data)}
.ph{color:var(--ink-muted)}
.inv .ph{color:var(--ink-inverse-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.skip{position:absolute;left:12px;top:-60px;z-index:95;background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:999px;text-decoration:none}
.skip:focus{top:12px}

/* ---------- Device frame ---------- */
.device{container:dev / inline-size;background:var(--surface);margin:0 auto;min-height:100vh;position:relative}
.device[data-dev="tablet"]{max-width:834px;margin-block:24px 120px;border-radius:28px;box-shadow:0 0 0 1px var(--line),0 40px 80px -40px rgba(0,0,0,.5);overflow:clip}
.device[data-dev="mobile"]{max-width:390px;margin-block:24px 120px;border-radius:36px;box-shadow:0 0 0 1px var(--line),0 40px 80px -40px rgba(0,0,0,.5);overflow:clip}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px),3cqi);padding-right:max(16px,env(safe-area-inset-right,0px),3cqi)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.06;z-index:1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
main,header,footer,section{position:relative;z-index:2}

/* ---------- Buttons, pills, badges ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 20px;font:600 15px/1.3 var(--f-body);text-decoration:none;cursor:pointer;border:1px solid var(--ink);transition:transform .45s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:var(--on-ink);box-shadow:var(--shadow-button)}
.btn-ghost{background:var(--surface-raised);color:var(--ink);border-color:var(--line)}
.roll{display:inline-grid;overflow:hidden;height:1.3em}
.roll span{grid-area:1/1;transition:transform .45s var(--ease)}
.roll span+span{transform:translateY(110%)}
.btn:hover .roll span:first-child{transform:translateY(-110%)}
.btn:hover .roll span+span{transform:translateY(0)}
.ico{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--marker);color:var(--on-marker);font-size:12px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-raised);color:var(--ink);cursor:pointer;display:inline-grid;place-items:center}
.iconbtn:hover{border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-raised);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:600 13px/1.3 var(--f-body);box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 24px -14px rgba(0,0,0,.25)}
.pill b{font-family:var(--f-data);font-weight:700}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;background:var(--surface-raised);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(31,138,76,.45)}70%{box-shadow:0 0 0 8px rgba(31,138,76,0)}100%{box-shadow:0 0 0 0 rgba(31,138,76,0)}}
.badge{display:inline-flex;align-items:center;font:400 10px/1.4 var(--f-data);border-radius:999px;padding:4px 9px;background:var(--surface-raised);color:var(--ink)}
.badge.k{background:var(--marker);color:var(--on-marker)}
.example{display:inline-flex;font:700 9px/1 var(--f-data);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--marker);border-radius:4px;padding:4px 6px}
.fields{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font:400 11.5px/1.5 var(--f-data)}
.fields dt{color:var(--ink-muted)}.fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
.inv .fields dt{color:var(--ink-inverse-muted)}

/* ---------- Header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:45;padding-block:14px;pointer-events:none}
.hdr .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.hdr-item{pointer-events:auto;transition:transform .55s var(--ease),opacity .4s}
.hdr.hide .hdr-item{transform:translateY(-150%);opacity:0}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-decoration:none;justify-self:start}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--marker);color:var(--on-marker);display:grid;place-items:center;font:700 11px/1 var(--f-data);box-shadow:inset 0 0 0 1.5px var(--on-marker)}
.navpill{display:flex;gap:2px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:4px}
.navpill a{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;text-decoration:none;font-size:14px;transition:background .25s}
.navpill a:hover{background:var(--surface-sunken)}
.navpill a[aria-current]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--marker);box-shadow:0 0 0 1.5px var(--ink)}
.navpill sup{font:400 9px/1 var(--f-data);color:var(--ink-muted);margin-left:-4px}
.hright{justify-self:end;display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-raised);font:400 11px/1 var(--f-data)}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-raised);cursor:pointer;display:grid;place-items:center}
.themebtn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.8}
.menubtn{display:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);cursor:pointer;font-size:16px}
.mnav{display:none}
@container dev (max-width:899px){
  .hdr .row{grid-template-columns:1fr auto}
  .navpill,.hright .status{display:none}
  .menubtn{display:grid;place-items:center}
  .mnav:not([hidden]){display:grid;gap:4px;margin-top:10px;background:var(--surface-raised);border:1px solid var(--line);border-radius:20px;padding:8px;pointer-events:auto;box-shadow:0 20px 40px -24px rgba(0,0,0,.4)}
  .mnav a{padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:500}
  .mnav a[aria-current]{background:var(--surface-sunken)}
}

/* ---------- Section frame ---------- */
.sec{padding-block:24px}
.panel{border-radius:28px;padding:clamp(22px,4cqi,48px);position:relative;overflow:hidden}
.panel.light{background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--line)}
.inv{background:var(--surface-inverse);color:var(--ink-inverse)}
.ghost{position:absolute;left:0;right:0;top:6px;text-align:center;font:800 clamp(64px,14cqi,220px)/1 var(--f-disp);letter-spacing:-.04em;text-transform:uppercase;color:var(--ink);opacity:.045;pointer-events:none;white-space:nowrap;overflow:hidden}
.inv .ghost{color:var(--ink-inverse)}
.st{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:10px 16px;margin-bottom:28px}
.st h2,.st h1{font:800 clamp(34px,6cqi,76px)/.95 var(--f-disp);letter-spacing:-.04em;text-transform:uppercase}
.st .n{font:400 13px/1 var(--f-data);color:var(--ink-muted)}
.inv .st .n{color:var(--ink-inverse-muted)}
.st p{grid-column:1/-1;font-size:18px;max-width:52ch;color:var(--ink-muted)}
.inv .st p{color:var(--ink-inverse-muted)}
.more{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;margin-top:24px;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.pagehead{padding-block:40px 8px;position:relative}
.pagehead .st{margin-bottom:12px}

/* ---------- Hero ---------- */
.hero{overflow-x:clip}
.hero-in{position:relative;padding:18px 0 40px;min-height:640px;display:grid}
.rec{display:flex;justify-content:space-between;gap:12px;font:400 11px/1.4 var(--f-data);color:var(--ink-muted);border-bottom:1px solid var(--line);padding-bottom:10px;position:relative;z-index:3;flex-wrap:wrap}
.name{position:relative;z-index:1;font:800 clamp(44px,9.2cqi,136px)/.9 var(--f-disp);letter-spacing:-.04em;text-transform:uppercase;display:flex;flex-wrap:wrap;column-gap:.18em;margin-top:22px}
.outline{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.inv .outline{-webkit-text-stroke-color:var(--ink-inverse)}
.stack{position:absolute;z-index:2;right:clamp(44px,5cqi,72px);top:104px;width:min(320px,30cqi)}
.cards{position:relative;aspect-ratio:4/5;cursor:pointer;touch-action:pan-y}
.pc{position:absolute;inset:0;margin:0;border-radius:22px;overflow:hidden;background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-lift);transform-origin:50% 100%;transition:transform .8s var(--ease),opacity .4s}
.pc[data-pos="0"]{z-index:3;transform:none}
.pc[data-pos="1"]{z-index:2;transform:translate(22px,-16px) rotate(5deg) scale(.95)}
.pc[data-pos="2"]{z-index:1;transform:translate(42px,-30px) rotate(10deg) scale(.9)}
.cards:hover .pc[data-pos="1"]{transform:translate(28px,-20px) rotate(7deg) scale(.95)}
.cards:hover .pc[data-pos="2"]{transform:translate(52px,-36px) rotate(12deg) scale(.9)}
.pc.leaving{transform:translate(-120%,10px) rotate(-14deg)!important;opacity:0;transition:transform .38s cubic-bezier(.7,0,.84,0),opacity .38s}
.photo{position:absolute;inset:0;background:radial-gradient(ellipse 19% 17% at 50% 33%,#77716a 0 97%,transparent 100%),radial-gradient(ellipse 9% 10% at 50% 49%,#3c3934 0 97%,transparent 100%),radial-gradient(ellipse 50% 44% at 50% 104%,#4b4741 0 98%,transparent 100%),linear-gradient(#dcd6ca,#cdc6b8)}
.dither{position:absolute;inset:0;background:var(--marker)}
.dither::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#141311 1.4px,transparent 1.7px) 0 0/5px 5px;-webkit-mask:radial-gradient(ellipse 19% 17% at 50% 33%,#000 97%,transparent 100%),radial-gradient(ellipse 9% 10% at 50% 49%,#000 97%,transparent 100%),radial-gradient(ellipse 50% 44% at 50% 104%,#000 98%,transparent 100%);mask:radial-gradient(ellipse 19% 17% at 50% 33%,#000 97%,transparent 100%),radial-gradient(ellipse 9% 10% at 50% 49%,#000 97%,transparent 100%),radial-gradient(ellipse 50% 44% at 50% 104%,#000 98%,transparent 100%)}
.pc figcaption{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:8px;font:400 10px/1.4 var(--f-data);background:var(--surface-raised);border-radius:12px;padding:8px 10px}
.pc.profile{padding:22px;display:grid;align-content:space-between}
.pc.profile .big{font:800 42px/.9 var(--f-disp);letter-spacing:-.04em;color:var(--marker)}
.stack-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.stack-lbl{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:6px 12px;font:400 11px/1.2 var(--f-data)}
.rbadge{position:absolute;z-index:4;left:-60px;top:-44px;width:120px;height:120px}
.rbadge svg{width:100%;height:100%;animation:spin 22s linear infinite}
.rbadge text{font:400 10.5px var(--f-data);letter-spacing:.12em;fill:var(--ink)}
.rbadge .core{position:absolute;inset:37px;border-radius:50%;background:var(--marker);color:var(--on-marker);display:grid;place-items:center;font:700 11px/1 var(--f-data)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-foot{position:relative;z-index:3;align-self:end;display:flex;flex-direction:column;gap:20px;margin-top:24px;max-width:calc(100% - min(320px,30cqi) - 120px)}
.intro{max-width:400px;display:grid;gap:14px}
.eyebrow{font:400 11px/1.4 var(--f-data);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}
.intro h1{font:700 28px/1.1 var(--f-disp);letter-spacing:-.02em}
.row-wrap{display:flex;flex-wrap:wrap;gap:10px}
@container dev (max-width:899px){
  .hero-in{min-height:0}
  .stack{position:relative;right:auto;top:auto;width:min(290px,76%);margin:40px 34px 0 auto}
  .rbadge{left:-44px;top:-34px;width:92px;height:92px}.rbadge .core{inset:28px;font-size:10px}
  .hero-foot{max-width:none}
}

/* ---------- Ribbon ---------- */
.ribbon{padding-block:20px 6px}
.rib{border-top:1px solid var(--line);padding-block:22px 26px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.track{display:flex;width:max-content;animation:mq 42s linear infinite}
.ribbon:hover .track{animation-play-state:paused}
.track ul{display:flex;align-items:center;gap:36px;padding:0 36px 0 0;margin:0;list-style:none}
.ti{flex:none;width:50px;height:50px;border-radius:12px;background:var(--bg);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(20,19,17,.06)}
.ti svg{width:27px;height:27px;fill:var(--fg)}
.ti.txt{background:var(--ink);color:var(--marker);font:700 11px/1.05 var(--f-data);text-align:center}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- Query, chips, view toggle ---------- */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.query{display:flex;align-items:center;gap:10px;border:1px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--surface-sunken);font:400 13px/1.4 var(--f-data);margin-bottom:14px}
.query label{color:var(--ink-muted);white-space:nowrap}
.query input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.kbd{font:400 11px/1 var(--f-data);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink-muted);background:var(--surface-raised)}
.chips{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface-sunken);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%}
.chip{border:0;background:transparent;border-radius:999px;padding:7px 14px;font:400 12px/1.2 var(--f-data);cursor:pointer;transition:background .45s var(--ease),color .25s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chip sup{font-size:9px;opacity:.65}
.count{font:400 11px/1 var(--f-data);color:var(--ink-muted);margin-top:14px}

/* ---------- Project cards ---------- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@container dev (max-width:759px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface-sunken);border-radius:18px;padding:8px;display:grid;text-decoration:none;color:inherit;min-width:0}
.card[hidden]{display:none}
.media{position:relative;border-radius:12px;aspect-ratio:16/10;overflow:hidden;background:repeating-linear-gradient(135deg,var(--placeholder) 0 10px,var(--surface-sunken) 10px 20px)}
.media .zoom{position:absolute;inset:0;transition:transform .8s var(--ease)}
.card:hover .media .zoom,.card:focus-visible .media .zoom{transform:scale(1.04)}
.media .badges{position:absolute;top:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px}
.media .lbl{position:absolute;right:12px;bottom:12px;font:400 10px/1.4 var(--f-data);background:var(--surface-raised);color:var(--ink-muted);border-radius:999px;padding:4px 9px}
.card .body{padding:16px 10px 10px;display:grid;gap:10px}
.card h3{font:600 22px/1.15 var(--f-disp);letter-spacing:-.02em}
.card p{font-size:15px;color:var(--ink-muted)}
.card .fields{border-top:1px solid var(--line);padding-top:10px}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;font:400 12px/1.5 var(--f-data);color:var(--ink-muted)}

/* ---------- Table view + hover preview ---------- */
.viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-sunken);font:400 11px/1 var(--f-data)}
.viewtoggle button{border:0;background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.tbl{width:100%;border-collapse:collapse;font:400 12px/1.5 var(--f-data)}
.tbl th{text-align:left;font-weight:500;color:var(--ink-muted);border-bottom:1px solid var(--ink);padding:8px}
.tbl td{padding:14px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.nm{font:600 18px/1.2 var(--f-disp);letter-spacing:-.02em}
.tbl tr.row{cursor:pointer;transition:background .2s}
.tbl tr.row:hover,.tbl tr.row:focus-within{background:var(--marker);color:var(--on-marker)}
.tbl tr.row a{text-decoration:none}
.preview{position:fixed;z-index:60;left:0;top:0;width:240px;aspect-ratio:16/10;border-radius:12px;pointer-events:none;opacity:0;transform:translate(-50%,-120%) scale(.9);transition:opacity .25s,transform .45s var(--ease);box-shadow:var(--shadow-lift);background:repeating-linear-gradient(135deg,var(--placeholder) 0 10px,var(--surface-raised) 10px 20px);display:grid;place-items:center;font:400 10px/1 var(--f-data);color:var(--ink-muted)}
.preview.on{opacity:1;transform:translate(-50%,-120%) scale(1)}
.only-desk{display:block}.only-small{display:none}
@container dev (max-width:899px){.only-desk{display:none}.only-small{display:block}.viewtoggle{display:none}}

/* ---------- Profile domains ---------- */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.prof .txt{font-size:18px;display:grid;gap:14px}
.levels{display:grid;gap:8px}

/* ---------- Behaviours ---------- */
function filter(){
  var q=($('#q')||{value:''}).value.trim().toLowerCase();state.q=q;var n=0;
  $$('.card[data-dom]').forEach(function(c){var ok=(state.dom==='tous'||c.dataset.dom.split(' ').indexOf(state.dom)>-1)&&(!q||c.dataset.hay.indexOf(q)>-1);c.hidden=!ok;if(ok)n++;});
  $$('tr.row').forEach(function(r){var ok=(state.dom==='tous'||r.dataset.dom.split(' ').indexOf(state.dom)>-1)&&(!q||r.dataset.hay.indexOf(q)>-1);r.hidden=!ok;});
  var e=$('#empty');if(e)e.hidden=n>0;var c=$('#count');if(c)c.textContent=n+' / '+P.length+' enregistrements';
}
function bind(id){
  var app=$('#app');
  /* chips */
  $$('.chip[data-d]').forEach(function(b){b.addEventListener('click',function(){state.dom=b.dataset.d;$$('.chip[data-d]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});filter();});});
  $$('.chips:not([aria-label="Filtrer par domaine"]) .chip').forEach(function(b,_,all){b.addEventListener('click',function(){all.forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});});
  var q=$('#q');if(q){q.addEventListener('input',filter);q.addEventListener('keydown',function(e){if(e.key==='Escape'){if(q.value){q.value='';filter();}else q.blur();}});}
  if($('#count'))filter();
  /* view toggle + preview */
  $$('.viewtoggle button').forEach(function(b){b.addEventListener('click',function(){state.view=b.dataset.v;render(false);});});
  var pv=$('#prev');
  $$('tr.row').forEach(function(r){
    r.addEventListener('click',function(e){if(!e.target.closest('a'))go('projet');});
    r.addEventListener('pointerenter',function(){if(fine)pv.classList.add('on');});
    r.addEventListener('pointerleave',function(){pv.classList.remove('on');});
    r.addEventListener('pointermove',function(e){pv.style.left=e.clientX+'px';pv.style.top=e.clientY+'px';});
    r.addEventListener('focusin',function(){var b=r.getBoundingClientRect();pv.style.left=(b.right-140)+'px';pv.style.top=(b.top+10)+'px';pv.classList.add('on');});
    r.addEventListener('focusout',function(){pv.classList.remove('on');});
  });
  /* accordion */
  $$('.accd').forEach(function(acc){$$('.head',acc).forEach(function(h){h.addEventListener('click',function(){var li=h.parentNode,o=!li.classList.contains('open');[].forEach.call(acc.children,function(x){x.classList.remove('open');x.querySelector('.head').setAttribute('aria-expanded','false');});if(o){li.classList.add('open');h.setAttribute('aria-expanded','true');}});});});
  /* band tiles */
  $$('.tile').forEach(function(t){t.addEventListener('click',function(){var v=t.dataset.t,i=state.picked.indexOf(v);if(i>-1)state.picked.splice(i,1);else state.picked.push(v);t.setAttribute('aria-pressed',String(i<0));var s=$('#sel');if(s)s.textContent=selText();});});
  var gc=$('#gocontact');if(gc)gc.addEventListener('click',function(){state.profile='client';});
  /* contact */
  $$('.seg button').forEach(function(b){b.addEventListener('click',function(){state.profile=b.dataset.p;render(false);var f=$('.seg button[aria-pressed="true"]');if(f)f.focus();});});
  $$('.ttags button').forEach(function(b){b.addEventListener('click',function(){var v=b.dataset.t,i=state.picked.indexOf(v);if(i>-1)state.picked.splice(i,1);else state.picked.push(v);b.setAttribute('aria-pressed',String(i<0));});});
  var f=$('#cform');if(f){f.addEventListener('submit',function(e){e.preventDefault();var em=$('#ce'),m=$('#cm'),bad=null;
    var e1=!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value);$('#ce-err').hidden=!e1;em.setAttribute('aria-invalid',String(e1));if(e1)bad=em;
    var e2=m.value.trim().length<20;$('#cm-err').hidden=!e2;m.setAttribute('aria-invalid',String(e2));if(e2&&!bad)bad=m;
    if(bad){bad.focus();return;}state.sent=true;render(false);var ok=$('#okmsg');if(ok)ok.focus();});}
  $$('.copy').forEach(function(b){b.addEventListener('click',function(){var t=b.textContent;b.textContent='Copié';setTimeout(function(){b.textContent=t;},2000);});});
  /* portrait stack */
  var cards=$('#cards');
  if(cards){var pcs=$$('.pc',cards),names=['portrait','vue données','fiche profil'],busy=false;
    function lay(){pcs.forEach(function(c,i){c.dataset.pos=String((i-state.stack+3)%3);c.setAttribute('aria-hidden',String(i!==state.stack));});$('#slbl').textContent=names[state.stack];$('#sidx').textContent=(state.stack+1)+'/3';}
    function nx(dir){if(busy)return;if(dir>0&&!reduce){busy=true;var c=pcs[state.stack];c.classList.add('leaving');setTimeout(function(){state.stack=(state.stack+1)%3;c.classList.remove('leaving');lay();busy=false;},380);}else{state.stack=(state.stack+(dir>0?1:2))%3;lay();}}
    $('#snext').addEventListener('click',function(){nx(1);});$('#sprev').addEventListener('click',function(){nx(-1);});
    var sx=null;cards.addEventListener('pointerdown',function(e){sx=e.clientX;});
    cards.addEventListener('pointerup',function(e){if(sx===null)return;var d=e.clientX-sx;sx=null;nx(Math.abs(d)>40&&d>0?-1:1);});
    cards.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();nx(1);}if(e.key==='ArrowLeft'){e.preventDefault();nx(-1);}});
    lay();}
  /* ribbon clone */
  var tr=$('#track');if(tr){var u=tr.querySelector('ul'),cl=u.cloneNode(true);cl.setAttribute('aria-hidden','true');tr.appendChild(cl);}
  /* header */
  var mb=$('#mbtn'),mn=$('#mnav');
  mb.addEventListener('click',function(){var open=mn.hidden;mn.hidden=!open;mb.setAttribute('aria-expanded',String(open));mb.textContent=open?'×':'☰';mb.setAttribute('aria-label',open?'Fermer le menu':'Menu');if(open){var a=mn.querySelector('a');if(a)a.focus();}});
  mn.addEventListener('keydown',function(e){if(e.key==='Escape'){mn.hidden=true;mb.setAttribute('aria-expanded','false');mb.textContent='☰';mb.focus();}});
  $('#themebtn').addEventListener('click',toggleTheme);
  $('#enbtn').addEventListener('click',function(e){var b=e.currentTarget;var r=b.getBoundingClientRect();reveal(r,function(){});b.blur();});
  /* toc */
  $$('[data-toc]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var t=document.getElementById(a.dataset.toc);if(t)t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});});});
  /* magnetic (2 buttons: hero primary + round) */
  if(fine&&!reduce){$$('.hero .btn-ink, .round').forEach(function(m){m.addEventListener('pointermove',function(e){var r=m.getBoundingClientRect();m.style.transform='translate('+((e.clientX-r.left-r.width/2)*.25)+'px,'+((e.clientY-r.top-r.height/2)*.25)+'px)';});m.addEventListener('pointerleave',function(){m.style.transform='';});});}
}

/* ---------- Theme with circular reveal ---------- */
function currentDark(){var t=document.documentElement.dataset.theme;if(t)return t==='dark';return window.matchMedia('(prefers-color-scheme: dark)').matches;}
function reveal(rect,fn){var x=rect.left+rect.width/2,y=rect.top+rect.height/2;document.documentElement.style.setProperty('--vx',x+'px');document.documentElement.style.setProperty('--vy',y+'px');
  if(document.startViewTransition&&!reduce)document.startViewTransition(fn);else fn();}
function toggleTheme(e){var r=e.currentTarget.getBoundingClientRect();reveal(r,function(){document.documentElement.dataset.theme=currentDark()?'light':'dark';});}

/* ---------- Router with curtain ---------- */
var PAGES_IDS=Object.keys(PAGES);
function render(scroll){
  var id=(location.hash||'#accueil').slice(1);
  if(['main','top'].indexOf(id)>-1)return;
  if(PAGES_IDS.indexOf(id)<0){var t=document.getElementById(id);if(t)return;id='introuvable';}
  if(id!=='contact')state.sent=false;
  $('#app').innerHTML=header(id)+PAGES[id]()+footer(id);
  $('#pgsel').value=id;
  bind(id);
  if(scroll!==false){window.scrollTo(0,0);var m=$('#main');if(m)m.focus({preventScroll:true});}
}
var navigating=false;
function go(id){if(location.hash==='#'+id){render();return;}location.hash=id;}
window.addEventListener('hashchange',function(){
  var id=location.hash.slice(1);
  if(id==='top'){window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});return;}
  if(PAGES_IDS.indexOf(id)<0&&document.getElementById(id))return;
  var c=$('#curtain');
  if(reduce||navigating){render();return;}
  navigating=true;$('#route').textContent=ROUTES[id]||'/fr/'+id;
  c.className='curtain in';
  setTimeout(function(){render();c.className='curtain out';setTimeout(function(){c.className='curtain';navigating=false;},700);},560);
});
$('#pgsel').addEventListener('change',function(e){go(e.target.value);});
$$('.dv button').forEach(function(b){b.addEventListener('click',function(){$('#dev').dataset.dev=b.dataset.d;$$('.dv button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});window.scrollTo(0,0);});});
/* header hide on scroll */
var lastY=0;window.addEventListener('scroll',function(){var h=$('#hdr');if(!h)return;var y=window.scrollY;if(!reduce&&y>lastY&&y>140&&!h.contains(document.activeElement))h.classList.add('hide');else if(y<lastY||y<=140)h.classList.remove('hide');lastY=y;
  var fg=$('#pfg');if(fg){var max=document.documentElement.scrollHeight-innerHeight,p=max>0?Math.min(1,y/max):0;fg.style.strokeDashoffset=String(157*(1-p));$('#ppct').textContent=Math.round(p*100)+'%';
    var on=null;$$('[data-toc]').forEach(function(a){var t=document.getElementById(a.dataset.toc);if(t&&t.getBoundingClientRect().top<200)on=a;});if(on)$$('[data-toc]').forEach(function(a){a.classList.toggle('on',a===on);});}
},{passive:true});
/* "/" shortcut */
document.addEventListener('keydown',function(e){if(e.key==='/'&&!/input|textarea|select/i.test((document.activeElement||{}).tagName||'')){var q=$('#q');if(q){e.preventDefault();q.focus();}}});
render();
})();
</script>
